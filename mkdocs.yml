site_name: xrddatasets
site_description: Open datasets converted into streamable ROOT files, and the site that serves them
site_url: https://example.org/xrddatasets/
repo_url: https://github.com/rob-c/xrddatasets
copyright: LGPL-3.0-or-later

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - The datasets: datasets.md
  - Running a site: datasets-site.md
  - Reference:
      - API: api.md
      - Maintainability metrics: maintainability.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]

watch:
  - src/xrddatasets
