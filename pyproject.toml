[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xrddatasets"
version = "0.1.0"
description = "Open datasets converted into streamable ROOT files, and the site that serves them"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Robert Currie", email = "robert.andrew.currie@gmail.com" }]
keywords = ["datasets", "open-data", "machine-learning", "root", "xrootd", "catalogue"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The layer this publishes for: a dataset is converted here and read back with
# xrdml, which brings xrdroot for the format and the client for the transport.
dependencies = ["xrdml @ git+https://github.com/rob-c/xrdml@main"]

[project.optional-dependencies]
# What the publishers' own formats need. None of it is imported until a
# dataset that arrives in that format is built, so a catalogue read, a site
# build of everything else, and the tests all run without any of it.
datasets = [
  "h5py>=3.8",
  "igor2>=0.5.12",
  "imagecodecs>=2023.3",
  "numpy>=1.23",
  "Pillow>=9",
  "pyarrow>=10",
  "tifffile>=2023.4",
]
dev = [
  "complexipy>=6,<7",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov",
  "pytest-timeout",
  "pytest-xdist",
  "radon>=6,<7",
  "ruff>=0.5",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
xrd-datasets = "xrddatasets.cli:main"

# The layers below are required by repository URL until they are on PyPI,
# and hatchling wants that said out loud.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/xrddatasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``tests/test_maintainability.py`` imports ``tools.maintainability``, and a
# bare ``pytest`` - which is what CI runs - does not put the working directory
# on the path the way ``python -m pytest`` does.
pythonpath = ["."]
timeout = 120
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
branch = true
source = ["xrddatasets"]
parallel = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.$",
  "if __name__ == .__main__.:",
]
include = ["*/xrddatasets/*"]
# Reported, deliberately not gated at 100. What is left uncovered in the
# builders is per-publisher download and retry branches: they are reached by
# fetching gigabytes from the people who publish the data, so a gate on them
# would measure the runner's network rather than this code. The converters
# themselves are covered from bytes in memory, and `xrd-datasets verify` is
# the check that matters for a directory anybody serves.
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
# RUF022/RUF023: ``__all__`` and ``__slots__`` are grouped by meaning here
# rather than alphabetised, with a comment on each group.
ignore = ["E741", "RUF022", "RUF023"]

[tool.mypy]
# The floor is 3.9 - what RHEL 9 and AlmaLinux 9 ship - but mypy itself refuses
# to be pointed below 3.10, so the floor is held by the interpreter instead:
# CI runs the suite on a real 3.9.
python_version = "3.10"
strict = true
packages = ["xrddatasets"]
mypy_path = "src"

# The publishers' format readers ship no stubs. They are reached through
# narrow, guarded imports, so untyped is the honest description of them
# rather than a hole in our own checking.
[[tool.mypy.overrides]]
module = ["h5py.*", "igor2.*", "imagecodecs.*", "PIL.*", "pyarrow.*", "tifffile.*", "zstandard.*"]
ignore_missing_imports = true

# numpy's stubs use syntax newer than the floor this package is checked
# against, so it is not followed into.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "matplotlib", "matplotlib.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
